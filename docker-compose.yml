services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brewlite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brewlite_dev}
      POSTGRES_DB: ${POSTGRES_DB:-brewlite}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brewlite}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Không mở cổng 5432 ra ngoài, chỉ api trong mạng nội bộ truy cập được

  api:
    build: ./apps/api
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-brewlite}:${POSTGRES_PASSWORD:-brewlite_dev}@db:5432/${POSTGRES_DB:-brewlite}
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      AUTO_SEED: ${AUTO_SEED:-true}
      STAFF_PASSWORD: ${STAFF_PASSWORD:-Staff@123}
      # VNPay sandbox (không bắt buộc): để trống thì POST /payments/vnpay trả 503, Ví/Thẻ mô phỏng vẫn chạy
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_URL: ${VNPAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:3000/payment/result}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    # Tạm tắt cho đến khi Minh Trí đẩy code apps/web lên.
    # Khi có code, XÓA hai dòng "profiles" bên dưới.
    profiles: ["web"]
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata: